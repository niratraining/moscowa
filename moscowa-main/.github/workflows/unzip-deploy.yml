name: Unzip and Deploy

# هر بار که یک فایل zip در ریشه‌ی ریپازیتوری آپلود یا تغییر کند، این ورک‌فلو اجرا می‌شود
on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip(s) and flatten into repo root
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "هیچ فایل zip ای در ریشه پیدا نشد، کاری برای انجام نیست."
            exit 0
          fi

          for zipfile in "${zips[@]}"; do
            echo "در حال پردازش: $zipfile"
            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            # اگر zip فقط شامل یک پوشه‌ی اصلی باشد (مثل moscowa-main/)،
            # محتوای همان پوشه به عنوان منبع در نظر گرفته می‌شود تا پوشه‌ی اضافه حذف شود
            entries=("$tmpdir"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmpdir"
            fi

            # حذف فایل/پوشه‌های اضافی و بی‌مصرف
            find "$src" -iname "__MACOSX" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$src" -iname ".DS_Store" -delete 2>/dev/null || true

            # کپی محتوای استخراج‌شده به ریشه‌ی ریپازیتوری (فایل‌های موجود بازنویسی می‌شوند)
            cp -rf "$src"/. .

            rm -rf "$tmpdir"
            rm -f "$zipfile"
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری برای کامیت وجود ندارد."
          else
            git commit -m "chore: auto-extract uploaded zip [skip ci]"
            git push
          fi
